plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mirrorhelper.app'
    // Play requirement (same bar as SimplyTimer v9): must target 36+.
    compileSdk 36

    defaultConfig {
        applicationId "com.mirrorhelper.app"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.0.1"
    }

    flavorDimensions += "dist"
    productFlavors {
        // FullDrop: SimplyMirror.exe lives in src/fullDrop/assets → works fully offline.
        fullDrop {
            dimension "dist"
            versionNameSuffix "-full"
        }
        // SkyDrop: no bundled exe (~1 MB) → downloads it from the GitHub release.
        // This is the Play-store flavor (no executable payload inside the app).
        skyDrop {
            dimension "dist"
            versionNameSuffix "-sky"
        }
    }

    // Release signing: reads android-app/keystore.properties (gitignored, never committed).
    // Without it the build falls back to the debug key WITH A WARNING — Play rejects
    // debug-signed uploads, so the store AAB must be built where keystore.properties exists.
    def ksProps = new Properties()
    def ksFile = rootProject.file("keystore.properties")
    if (ksFile.exists()) { ksFile.withInputStream { ksProps.load(it) } }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug { }
        release {
            // Generates mapping.txt -> upload to Play to clear the
            // "no deobfuscation file" warning.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Generates native-debug-symbols.zip if any .so appears ->
            // upload to Play to clear the "no debug symbols" warning.
            // Harmless for our pure-Kotlin app (no .so today).
            ndk {
                debugSymbolLevel 'FULL'
            }
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
                println("WARNING: keystore.properties missing — release signed with DEBUG key (Play will reject it).")
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }
}

dependencies {
    // No external deps on purpose — stdlib only so the APK builds anywhere.
    // No native .so -> no "debug symbols" warning on Play.
}
